<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>vLLM 实时监控</title><style>
:root{color-scheme:dark;--bg:#080d18;--panel:#111a2c;--line:#22304b;--muted:#8da0bf;--green:#38e8a1;--cyan:#47c8ff;--orange:#ffb454}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#172541 0,#080d18 42%);font:14px system-ui;color:#eef5ff}.wrap{max-width:1280px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}h1{margin:0;font-size:25px}.sub{color:var(--muted);margin-top:6px}.status{padding:7px 12px;border:1px solid var(--line);border-radius:20px}.ok{color:var(--green)}.bad{color:#ff6b7a}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.chart,.gpu{background:linear-gradient(145deg,#131e32dd,#0d1525dd);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 14px 40px #0004}.label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}.value{font-size:31px;font-weight:700;margin-top:10px}.unit{font-size:13px;color:var(--muted);font-weight:400}.wide{grid-column:span 2}.chart{grid-column:span 4;height:300px}canvas{width:100%;height:235px}.section{margin:24px 0 12px;font-size:16px}.gpus{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.gpuhead{display:flex;justify-content:space-between}.bar{height:7px;background:#25324a;border-radius:5px;overflow:hidden;margin:7px 0 14px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--cyan))}.stats{display:grid;grid-template-columns:repeat(3,1fr);color:var(--muted)}.stats b{display:block;color:#fff;font-size:17px;margin-top:4px}.foot{color:var(--muted);margin-top:18px;font-size:12px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.chart{grid-column:span 2}.gpus{grid-template-columns:1fr}.wrap{padding:16px}.value{font-size:25px}}
</style></head><body><div class="wrap"><header><div><h1>vLLM 实时监控</h1><div class="sub" id="source">正在连接…</div></div><div class="status" id="status">● 等待数据</div></header>
<main class="grid"><div class="card"><div class="label">Prefill 速度</div><div class="value"><span id="prefill">—</span> <span class="unit">tok/s</span></div></div><div class="card"><div class="label">当前输出速度</div><div class="value"><span id="decode">—</span> <span class="unit">tok/s</span></div></div><div class="card"><div class="label">累计输出 Token</div><div class="value" id="generated">—</div></div><div class="card"><div class="label">Token 总处理量</div><div class="value" id="total">—</div></div><div class="card"><div class="label">运行 / 等待请求</div><div class="value"><span id="running">—</span> <span class="unit">/ <span id="waiting">—</span></span></div></div><div class="card"><div class="label">已完成请求</div><div class="value" id="finished">—</div></div><div class="card wide"><div class="label">KV Cache 使用率</div><div class="value"><span id="cache">—</span> <span class="unit">%</span></div></div><div class="chart"><div class="label">实时吞吐趋势</div><canvas id="chart"></canvas></div></main><div class="section">GPU 状态</div><div class="gpus" id="gpus"></div><div class="foot" id="updated"></div></div>
<script>
const $=id=>document.getElementById(id),fmt=v=>v==null?'—':Intl.NumberFormat('zh-CN',{maximumFractionDigits:1,notation:v>999999?'compact':'standard'}).format(v);function draw(hist){const c=$('chart'),d=devicePixelRatio||1,r=c.getBoundingClientRect();c.width=r.width*d;c.height=r.height*d;const x=c.getContext('2d');x.scale(d,d);const w=r.width,h=r.height,p=28;x.clearRect(0,0,w,h);const max=Math.max(10,...hist.flatMap(v=>[v.prefill_rate,v.decode_rate]));x.strokeStyle='#22304b';x.lineWidth=1;for(let i=0;i<5;i++){let y=p+(h-2*p)*i/4;x.beginPath();x.moveTo(p,y);x.lineTo(w-p,y);x.stroke()}function line(key,color){x.strokeStyle=color;x.lineWidth=2;x.beginPath();hist.forEach((v,i)=>{let xx=p+(w-2*p)*(i/Math.max(hist.length-1,1)),yy=h-p-(h-2*p)*v[key]/max;i?x.lineTo(xx,yy):x.moveTo(xx,yy)});x.stroke()}line('prefill_rate','#47c8ff');line('decode_rate','#38e8a1');x.fillStyle='#8da0bf';x.font='12px system-ui';x.fillText('Prefill',p,15);x.fillStyle='#47c8ff';x.fillRect(p+45,7,16,3);x.fillStyle='#8da0bf';x.fillText('输出',p+80,15);x.fillStyle='#38e8a1';x.fillRect(p+110,7,16,3);x.fillStyle='#8da0bf';x.fillText(fmt(max)+' tok/s',w-100,15)}
async function refresh(){try{const d=await fetch('/api/status').then(r=>r.json());$('status').textContent=d.online?'● vLLM 在线':'● vLLM 离线';$('status').className='status '+(d.online?'ok':'bad');$('source').textContent=d.source+(d.error?' · '+d.error:'');for(const [id,k] of [['prefill','prefill_rate'],['decode','decode_rate'],['generated','generation_tokens_total'],['total','tokens_total'],['running','requests_running'],['waiting','requests_waiting'],['finished','requests_finished'],['cache','kv_cache_usage']])$(id).textContent=fmt(d[k]);$('gpus').innerHTML=d.gpus.map(g=>`<div class="gpu"><div class="gpuhead"><b>GPU ${g.index} · ${g.name}</b><span>${g.temperature}°C</span></div><div class="label">显存 ${fmt(g.memory_used)} / ${fmt(g.memory_total)} MiB</div><div class="bar"><i style="width:${100*g.memory_used/g.memory_total}%"></i></div><div class="stats"><span>GPU 利用率<b>${g.util}%</b></span><span>显存占用<b>${(100*g.memory_used/g.memory_total).toFixed(1)}%</b></span><span>功耗<b>${g.power==null?'—':g.power+' W'}</b></span></div></div>`).join('')||`<div class="gpu bad">无法读取 GPU：${d.gpu_error||'无数据'}</div>`;$('updated').textContent='最后更新：'+new Date(d.updated_at).toLocaleString();draw(d.history)}catch(e){$('status').textContent='● 面板后端离线';$('status').className='status bad'}}refresh();setInterval(refresh,2000);addEventListener('resize',refresh);
</script></body></html>
